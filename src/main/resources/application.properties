spring.application.name=assignment1-stt
# Allow more than 200 simultaneous blocking requests.
server.tomcat.threads.max=${SERVER_MAX_THREADS:300}
server.tomcat.threads.min-spare=${SERVER_MIN_SPARE_THREADS:20}

# Prevent outbound cloud requests from occupying worker threads indefinitely.
spring.http.clients.connect-timeout=${HTTP_CONNECT_TIMEOUT:3s}
spring.http.clients.read-timeout=${HTTP_READ_TIMEOUT:8s}